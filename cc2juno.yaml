# cc2juno - MIDI CC to Roland Alpha Juno sysex mapping
#
# Each entry under a layer section assigns one incoming CC number to one of the
# 36 Alpha Juno tone parameters. Names are matched case- and
# punctuation-insensitively, so 'VCF Cutoff', 'vcf_cutoff' and 'VCF cutoff'
# are all the same parameter. A bare parameter index (0-35) also works.
#
# Write 'off' instead of a CC number to disable an entry without deleting it:
#
#   "VCF Cutoff": off
#
# Incoming CC values are 0-127. Parameters that accept fewer values get the
# 128 CC steps split into equal regions - a 4-option parameter reads
# 0-31 as option 0, 32-63 as 1, 64-95 as 2, 96-127 as 3. To take the CC
# value literally instead (clipping above the maximum), write:
#
#   "Bender Range": {cc: 90, mode: clamp}
#
# The synth must have sysex receive switched ON (under the MIDI button) and
# its basic channel must match midi.synth_channel below.

# Default MIDI ports, so the program can start without prompting. Each may be
# a port name, any distinctive part of one, or a port index. Use 'ask' to be
# prompted. --in/--out override these; --ask-ports ignores them.
# These were written by the web version, which names ports the way the browser
# does; the CLI matches on any distinctive part, so they usually suit both.
ports:
  input: "4ACBCC15 MIDI 1"
  output: "UA-25 MIDI 1"

midi:
  synth_channel: 1        # Alpha Juno basic channel, 1-16
  listen_channel: any     # 1-16 to accept CCs on one channel only, or 'any'

  # Sysex header bytes. The Roland/PG-300 charts give level 0x20, group 0x01.
  # A 1995 usenet transcription gives 0x01 / 0x01 instead; if your unit ignores
  # everything this program sends, try level_byte: 0x01.
  level_byte: 0x20
  group_byte: 0x01

  # Each sysex message is 10 bytes, about 3.2 ms on a 31250 baud DIN cable.
  # A fast knob sweep can easily outrun the synth's input buffer, so outgoing
  # messages are rate limited and only the newest value per parameter is kept.
  max_msgs_per_sec: 100

  # Dead zone in CC counts at the edges of a quantized parameter's regions,
  # so a jittery pot does not flip back and forth between two options. 0 = off.
  hysteresis: 2

  # Pass everything this program does not translate - notes, pitch bend,
  # aftertouch, unmapped CCs - straight from the input to the output, so one
  # keyboard with knobs can both play the synth and edit it. Mapped CCs are
  # consumed and never forwarded. --thru / --no-thru override this.
  thru: false

# Physical arrangement of the knobs, for the web front-end. Row-major,
# one entry per cell, 'off' where there is no knob. The other builds do not
# draw anything but do keep this section intact when they rewrite the file.
layout:
  rows: 3
  cols: 5
  ccs: "15, 2, 9, 6, 3, 11, 13, 10, 7, 4, 12, 14, 1, 8, 5"

# Layering. One knob picks which set of assignments the other knobs use,
# by cutting its 0-127 travel into one region per layer. The layer knob
# itself means the same thing on every layer and can never be mapped to a
# parameter. Each layer's assignments live in its own section below,
# 'layer1' to 'layer3'. A layer with nothing mapped is a valid
# parked position where no knob does anything.
layers:
  cc: 5
  count: 3
  names: "Oscillators, Env, Filter"    # comma separated, for the log only
  startup: 1      # layer to assume until the knob is moved

layer1:    # Oscillators
  "DCO Env. Mode":  12   # #0 | 0=Normal, 1=Inverted, 2=Normal-Dynamic, 3=Inverted-Dynamic | NB: CC12 is normally Effect Control 1
  "VCF Env. Mode":  off  # #1 | 0=Normal, 1=Inverted, 2=Normal-Dynamic, 3=Dynamic
  "VCA Env. Mode":  off  # #2 | 0=Normal, 1=Gate, 2=Normal-Dynamic, 3=Gate-Dynamic
  "DCO Wave Pulse": 2    # #3 | 0..3 | NB: CC2 is normally Breath Controller
  "DCO Wave Saw":   9    # #4 | 0..5
  "DCO Wave Sub":   6    # #5 | 0..5 | NB: CC6 is normally Data Entry MSB
  "DCO Range":      15   # #6 | 0=4', 1=8', 2=16', 3=32'
  "DCO Sub Level":  3    # #7 | 0..3
  "DCO Noise":      11   # #8 | 0..3 | NB: CC11 is normally Expression
  "HPF Cutoff":     off  # #9 | 0..3
  "Chorus Switch":  off  # #10 | 0=Off, 1=On
  "DCO LFO Mod.":   14   # #11 | 0..127
  "DCO ENV Mod.":   7    # #12 | 0..127 | NB: CC7 is normally Channel Volume
  "DCO After Mod.": off  # #13 | 0..127
  "DCO PWM Depth":  13   # #14 | 0..127 | NB: CC13 is normally Effect Control 2
  "DCO PWM Rate":   10   # #15 | 0..127 | 0 = pulse width manual, 1..127 = PW LFO rate | NB: CC10 is normally Pan
  "VCF Cutoff":     off  # #16 | 0..127
  "VCF Resonance":  off  # #17 | 0..127
  "VCF LFO Mod.":   off  # #18 | 0..127
  "VCF ENV Mod.":   off  # #19 | 0..127
  "VCF Key Follow": off  # #20 | 0..127
  "VCF Aftertouch": off  # #21 | 0..127
  "VCA Level":      off  # #22 | 0..127
  "VCA Aftertouch": off  # #23 | 0..127
  "LFO Rate":       off  # #24 | 0..127
  "LFO Delay":      off  # #25 | 0..127
  "ENV T1":         off  # #26 | 0..127 | attack time
  "ENV L1":         off  # #27 | 0..127 | attack level
  "ENV T2":         off  # #28 | 0..127 | break time
  "ENV L2":         off  # #29 | 0..127 | break level
  "ENV T3":         off  # #30 | 0..127 | decay time
  "ENV L3":         off  # #31 | 0..127 | sustain level
  "ENV T4":         off  # #32 | 0..127 | release time
  "ENV Key Follow": off  # #33 | 0..127
  "Chorus Rate":    off  # #34 | 0..127
  "Bender Range":   off  # #35 | 0..12

layer2:    # Env
  "DCO Env. Mode":  off  # #0 | 0=Normal, 1=Inverted, 2=Normal-Dynamic, 3=Inverted-Dynamic
  "VCF Env. Mode":  off  # #1 | 0=Normal, 1=Inverted, 2=Normal-Dynamic, 3=Dynamic
  "VCA Env. Mode":  12   # #2 | 0=Normal, 1=Gate, 2=Normal-Dynamic, 3=Gate-Dynamic | NB: CC12 is normally Effect Control 1
  "DCO Wave Pulse": off  # #3 | 0..3
  "DCO Wave Saw":   off  # #4 | 0..5
  "DCO Wave Sub":   off  # #5 | 0..5
  "DCO Range":      off  # #6 | 0=4', 1=8', 2=16', 3=32'
  "DCO Sub Level":  off  # #7 | 0..3
  "DCO Noise":      off  # #8 | 0..3
  "HPF Cutoff":     off  # #9 | 0..3
  "Chorus Switch":  off  # #10 | 0=Off, 1=On
  "DCO LFO Mod.":   off  # #11 | 0..127
  "DCO ENV Mod.":   off  # #12 | 0..127
  "DCO After Mod.": off  # #13 | 0..127
  "DCO PWM Depth":  off  # #14 | 0..127
  "DCO PWM Rate":   off  # #15 | 0..127 | 0 = pulse width manual, 1..127 = PW LFO rate
  "VCF Cutoff":     off  # #16 | 0..127
  "VCF Resonance":  off  # #17 | 0..127
  "VCF LFO Mod.":   off  # #18 | 0..127
  "VCF ENV Mod.":   off  # #19 | 0..127
  "VCF Key Follow": off  # #20 | 0..127
  "VCF Aftertouch": off  # #21 | 0..127
  "VCA Level":      7    # #22 | 0..127 | NB: CC7 is normally Channel Volume
  "VCA Aftertouch": off  # #23 | 0..127
  "LFO Rate":       off  # #24 | 0..127
  "LFO Delay":      off  # #25 | 0..127
  "ENV T1":         15   # #26 | 0..127 | attack time
  "ENV L1":         11   # #27 | 0..127 | attack level | NB: CC11 is normally Expression
  "ENV T2":         2    # #28 | 0..127 | break time | NB: CC2 is normally Breath Controller
  "ENV L2":         13   # #29 | 0..127 | break level | NB: CC13 is normally Effect Control 2
  "ENV T3":         9    # #30 | 0..127 | decay time
  "ENV L3":         10   # #31 | 0..127 | sustain level | NB: CC10 is normally Pan
  "ENV T4":         6    # #32 | 0..127 | release time | NB: CC6 is normally Data Entry MSB
  "ENV Key Follow": 3    # #33 | 0..127
  "Chorus Rate":    off  # #34 | 0..127
  "Bender Range":   off  # #35 | 0..12

layer3:    # Filter
  "DCO Env. Mode":  off  # #0 | 0=Normal, 1=Inverted, 2=Normal-Dynamic, 3=Inverted-Dynamic
  "VCF Env. Mode":  12   # #1 | 0=Normal, 1=Inverted, 2=Normal-Dynamic, 3=Dynamic | NB: CC12 is normally Effect Control 1
  "VCA Env. Mode":  off  # #2 | 0=Normal, 1=Gate, 2=Normal-Dynamic, 3=Gate-Dynamic
  "DCO Wave Pulse": off  # #3 | 0..3
  "DCO Wave Saw":   off  # #4 | 0..5
  "DCO Wave Sub":   off  # #5 | 0..5
  "DCO Range":      off  # #6 | 0=4', 1=8', 2=16', 3=32'
  "DCO Sub Level":  off  # #7 | 0..3
  "DCO Noise":      off  # #8 | 0..3
  "HPF Cutoff":     15   # #9 | 0..3
  "Chorus Switch":  14   # #10 | 0=Off, 1=On
  "DCO LFO Mod.":   off  # #11 | 0..127
  "DCO ENV Mod.":   off  # #12 | 0..127
  "DCO After Mod.": off  # #13 | 0..127
  "DCO PWM Depth":  off  # #14 | 0..127
  "DCO PWM Rate":   off  # #15 | 0..127 | 0 = pulse width manual, 1..127 = PW LFO rate
  "VCF Cutoff":     2    # #16 | 0..127 | NB: CC2 is normally Breath Controller
  "VCF Resonance":  9    # #17 | 0..127
  "VCF LFO Mod.":   6    # #18 | 0..127 | NB: CC6 is normally Data Entry MSB
  "VCF ENV Mod.":   3    # #19 | 0..127
  "VCF Key Follow": 11   # #20 | 0..127 | NB: CC11 is normally Expression
  "VCF Aftertouch": off  # #21 | 0..127
  "VCA Level":      13   # #22 | 0..127 | NB: CC13 is normally Effect Control 2
  "VCA Aftertouch": off  # #23 | 0..127
  "LFO Rate":       10   # #24 | 0..127 | NB: CC10 is normally Pan
  "LFO Delay":      7    # #25 | 0..127 | NB: CC7 is normally Channel Volume
  "ENV T1":         off  # #26 | 0..127 | attack time
  "ENV L1":         off  # #27 | 0..127 | attack level
  "ENV T2":         off  # #28 | 0..127 | break time
  "ENV L2":         off  # #29 | 0..127 | break level
  "ENV T3":         off  # #30 | 0..127 | decay time
  "ENV L3":         off  # #31 | 0..127 | sustain level
  "ENV T4":         off  # #32 | 0..127 | release time
  "ENV Key Follow": off  # #33 | 0..127
  "Chorus Rate":    1    # #34 | 0..127 | NB: CC1 is normally Modulation Wheel
  "Bender Range":   8    # #35 | 0..12 | NB: CC8 is normally Balance
